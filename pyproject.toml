[project]
name = "paperforge"
version = "0.1.0"
description = "A research dependency engine that tracks the graph between experiments and scientific claims."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "rich>=13.0",
    "llm>=0.31.1",
]

[project.scripts]
paperforge = "paperforge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.ruff.lint.per-file-ignores]
"src/paperforge/cli.py" = ["B008"]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true
